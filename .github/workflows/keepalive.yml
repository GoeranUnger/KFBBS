# Verhindert, dass das kostenlose Supabase-Projekt nach 7 Tagen ohne Aktivität pausiert.
# Einrichtung: GitHub-Repo > Settings > Secrets and variables > Actions >
# Secrets "SUPABASE_URL" (https://xxxx.supabase.co) und "SUPABASE_ANON_KEY" anlegen.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"   # montags und donnerstags
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/spots?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
